# Build on every pull request, deploy to Hostinger on every push to master.
#
# The build output is never committed: CI produces `dist/` from source, and
# what lands on the server is exactly what this workflow built.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER      FTP IP from hPanel -> Files -> FTP Accounts
#   FTP_USERNAME    the FTP account username, e.g. u102457472
#   FTP_PASSWORD    that account's password
#   FTP_REMOTE_DIR  /domains/junaidnazir.dev/public_html/  (addon domain root)
#
# See DEPLOYMENT.md for where each of those comes from.

name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# One deploy at a time. A second push mid-upload would interleave two sets of
# files on the server, which is how a half-deployed site happens.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails rather
      # than silently resolving something newer than what was tested locally.
      - run: npm ci

      # `npm run build` runs `tsc --noEmit` first, so a type error fails the
      # pipeline before anything reaches the server.
      - run: npm run build

      - name: Upload to Hostinger
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # The action keeps a manifest on the server and uploads only what
          # changed, so a routine content edit is a handful of files rather
          # than the whole build.
          state-name: .ftp-deploy-sync-state.json
          # Never wipe the remote directory: mail folders, .well-known and any
          # hand-uploaded file live alongside the build.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # A successful upload is not a successful deploy: files can land in a
      # directory the web server does not serve, which is exactly what happened
      # for three days. One request, and the run fails honestly if the site is
      # not serving the bundle this run just built.
      - name: Verify the site is serving this build
        if: github.event_name != 'pull_request'
        env:
          SITE: https://junaidnazir.dev
        run: |
          asset=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 "$SITE/?ci=$GITHUB_RUN_ID" | grep -q "$asset"; then
              echo "Live: $asset"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$SITE is not serving $asset — check FTP_REMOTE_DIR."
          exit 1
