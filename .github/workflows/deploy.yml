# Build on every pull request, deploy to Hostinger on every push to master.
#
# The build output is never committed: CI produces `dist/` from source, and
# what lands on the server is exactly what this workflow built.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER      host from hPanel -> Files -> FTP Accounts (e.g. ftp.example.com)
#   FTP_USERNAME    the FTP account username (usually u123456789.example.com)
#   FTP_PASSWORD    that account's password
#   FTP_REMOTE_DIR  target directory, with a trailing slash (e.g. /public_html/)
#
# See DEPLOYMENT.md for where each of those comes from.

name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# One deploy at a time. A second push mid-upload would interleave two sets of
# files on the server, which is how a half-deployed site happens.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails rather
      # than silently resolving something newer than what was tested locally.
      - run: npm ci

      # `npm run build` runs `tsc --noEmit` first, so a type error fails the
      # pipeline before anything reaches the server.
      - run: npm run build

      # An unset or misnamed secret evaluates to an empty string, and the
      # deploy action treats an empty server-dir as "wherever the login
      # lands" — a green run that uploads to the wrong directory. Fail here
      # instead. Lengths are safe to print; the values themselves are masked.
      - name: Verify deploy secrets
        if: github.event_name != 'pull_request'
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          fail=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::$1 is empty — check it is under Settings > Secrets and variables > Actions > Secrets (not Variables), spelled exactly $1"
              fail=1
            else
              echo "$1 is set (${#2} characters)"
            fi
          }
          check FTP_SERVER "$SERVER"
          check FTP_USERNAME "$USERNAME"
          check FTP_PASSWORD "$PASSWORD"
          check FTP_REMOTE_DIR "$REMOTE_DIR"
          case "$REMOTE_DIR" in
            /*/) ;;
            *) echo "::error::FTP_REMOTE_DIR must start and end with a slash, e.g. /public_html/"; fail=1 ;;
          esac
          exit $fail

      # TEMPORARY diagnostic. Lists what the FTP login actually sees, so we can
      # tell which account and directory the uploads are landing in. Filenames
      # are not secrets; the credentials stay masked. Delete this step once the
      # deploy is landing in the right place.
      - name: Diagnose FTP layout
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          echo "=============================================="
          echo "absolute path of the login directory"
          echo "=============================================="
          # The 257 reply carries the real server-side path, which tells us
          # whether this login is chrooted and where.
          curl -sv --ssl-reqd --max-time 30 --user "$USERNAME:$PASSWORD" \
            -Q "PWD" "ftp://$SERVER/" --list-only 2>&1 \
            | grep -E "^< (2[0-9][0-9]|5[0-9][0-9])" | head -12

          list() {
            echo "=============================================="
            echo "listing: $1"
            echo "=============================================="
            curl -sk --ssl-reqd --max-time 30 --user "$USERNAME:$PASSWORD" \
              "ftp://$SERVER$1" --list-only || echo "(could not list $1)"
          }
          list "/"
          list "/../"
          list "/../../"
          list "/domains/"

      - name: Upload to Hostinger
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # The action keeps a manifest on the server and uploads only what
          # changed, so a routine content edit is a handful of files rather
          # than the whole build.
          state-name: .ftp-deploy-sync-state.json
          # Never wipe the remote directory: mail folders, .well-known and any
          # hand-uploaded file live alongside the build.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # A successful upload is not a successful deploy: the files can land in a
      # directory the web server does not serve. Ask the live site whether it
      # is actually serving the bundle this run just built.
      - name: Verify the site is serving this build
        if: github.event_name != 'pull_request'
        run: |
          asset=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          echo "Looking for $asset on $SITE"
          # Retry: LiteSpeed can serve a stale copy for a few seconds.
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$SITE/?ci=$GITHUB_RUN_ID" | grep -q "$asset"; then
              echo "Live site is serving this build."
              exit 0
            fi
            echo "Not live yet (attempt $attempt), waiting..."
            sleep 10
          done
          echo "::error::Upload succeeded but $SITE is not serving $asset. The files most likely went to a directory that is not the document root — check FTP_REMOTE_DIR."
          exit 1
        env:
          SITE: https://junaidnazir.dev
